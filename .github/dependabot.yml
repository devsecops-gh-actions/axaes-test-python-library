# Dependabot generado por devsecops-scaffold (plantilla security/dependabot/dependabot.yml.tmpl, WS3).
# Los PR los revisa devsecops-deps (WS5). Auto-merge solo en deps:patch y deps:minor.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "ecosystem:pip"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "ecosystem:github-actions"
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
