# Caller de seguridad de código de axaes-template-python-library (stack python, soportado por CodeQL).
# Checks requeridos (PLAN.md 2.1): "Security / codeql", "Security / dependency-review", "Security / secret-scan".
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    name: Security
    uses: devsecops-gh-actions/shared-workflows/.github/workflows/security.yml@REPLACE_SHA_SHARED_WORKFLOWS
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    with:
      languages: "python"
      dependency-fail-on-severity: high
      require-push-protection: true
